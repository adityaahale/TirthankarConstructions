<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Construction site placeholder background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2933"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2994a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f2994a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="900" height="900" fill="url(#glow)"/>
  <!-- Skyline of simple building blocks -->
  <g fill="#2b3642">
    <rect x="60" y="560" width="140" height="340"/>
    <rect x="220" y="460" width="120" height="440"/>
    <rect x="360" y="620" width="160" height="280"/>
    <rect x="540" y="500" width="110" height="400"/>
    <rect x="1000" y="540" width="150" height="360"/>
    <rect x="1170" y="440" width="130" height="460"/>
    <rect x="1320" y="600" width="170" height="300"/>
  </g>
  <!-- Building windows -->
  <g fill="#f2994a" opacity="0.35">
    <rect x="80" y="590" width="18" height="18"/>
    <rect x="120" y="590" width="18" height="18"/>
    <rect x="80" y="630" width="18" height="18"/>
    <rect x="120" y="630" width="18" height="18"/>
    <rect x="245" y="500" width="18" height="18"/>
    <rect x="285" y="500" width="18" height="18"/>
    <rect x="245" y="540" width="18" height="18"/>
    <rect x="285" y="540" width="18" height="18"/>
    <rect x="1020" y="580" width="18" height="18"/>
    <rect x="1060" y="580" width="18" height="18"/>
    <rect x="1190" y="480" width="18" height="18"/>
    <rect x="1230" y="480" width="18" height="18"/>
  </g>
  <!-- Crane -->
  <g stroke="#f2994a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <line x1="720" y1="900" x2="720" y2="260"/>
    <line x1="720" y1="260" x2="1010" y2="260"/>
    <line x1="720" y1="260" x2="640" y2="320"/>
    <line x1="720" y1="330" x2="770" y2="260"/>
    <line x1="960" y1="260" x2="960" y2="420"/>
    <line x1="700" y1="900" x2="740" y2="900"/>
  </g>
  <circle cx="960" cy="430" r="7" fill="#f2994a"/>
  <rect x="0" y="860" width="1600" height="40" fill="#0d1117"/>
</svg>
